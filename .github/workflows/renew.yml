name: Host-Ship Auto Renew

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动检查
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests "requests[socks]"
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb fonts-noto-cjk x11-utils
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get -f install -y
          google-chrome --version

      - name: Setup optional VLESS/VMess/Trojan node
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "NODE_LINK detected, setting up local proxy..."
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          else
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "No NODE_LINK, direct connection will be used."
          fi

      - name: Run renew (real chrome under xvfb)
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HOSTSHIP_LOGIN: ${{ secrets.HOSTSHIP_LOGIN }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" \
            python hostship_renew.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-debug-screenshots
          path: |
            hostship_*.png
          if-no-files-found: ignore
