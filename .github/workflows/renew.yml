name: Host-Ship Auto Renew

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动检查
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Setup optional VLESS/VMess/Trojan node
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "NODE_LINK detected, setting up local proxy..."
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          else
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "No NODE_LINK, direct connection will be used."
          fi

      - name: Run renew (HTTP)
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HOSTSHIP_COOKIES: ${{ secrets.HOSTSHIP_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: python hostship_renew.py
